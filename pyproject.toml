[project]
name = "cook-build"
version = "1.2.2"
description = "A Python-native build system with content-hash-based incremental builds"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-cloud-storage>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/tillahoffmann/cook-build"
Repository = "https://github.com/tillahoffmann/cook-build"
Issues = "https://github.com/tillahoffmann/cook-build/issues"

[project.scripts]
cook = "cook.cli:main"

[tool.setuptools.package-data]
cook = ["static/**/*"]

[dependency-groups]
dev = [
    "build>=1.4.2",
    "pre-commit>=4.5.1",
    "pyright>=1.1.408",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.5",
]

[tool.coverage.run]
omit = ["src/cook/__main__.py"]

[tool.coverage.report]
exclude_also = [
    "raise NotImplementedError",
]
